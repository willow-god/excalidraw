name: Build and Deploy to Page Branch

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ 安装 Node.js 并缓存 yarn
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      # 3️⃣ 安装依赖
      - name: Install dependencies
        working-directory: excalidraw-app
        run: yarn install --frozen-lockfile

      # 4️⃣ 构建项目
      - name: Build
        working-directory: excalidraw-app
        run: yarn build

      # 5️⃣ 将产物作为独立 repo 推送到 page 分支
      - name: Deploy build as clean repo
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          # 创建临时目录存放构建产物
          TEMP_DIR=$(mktemp -d)
          cp -r excalidraw-app/build/* "$TEMP_DIR"

          cd "$TEMP_DIR"

          # 初始化新的 Git 仓库
          git init
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git remote add origin $REPO
          git checkout -b page

          # 提交构建产物
          git add .
          git commit -m "Deploy build artifacts"

          # 强制推送到 page 分支
          git push origin page --force